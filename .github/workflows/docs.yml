name: docs

on:
  push:
    paths-ignore:
      - '.agents/**'
      - '.github/workflows/linux.yml'
      - '.github/workflows/macos.yml'
      - '.github/workflows/cmake.yml'
      - '.github/workflows/windows.yml'
      - 'AGENTS.md'
      - 'CCache/**'
      - 'CHANGES*'
      - 'Examples/**'
      - 'Lib/**'
      - 'Source/**'
      - 'Tools/**'
  pull_request:
    branches: master
    paths-ignore:
      - '.agents/**'
      - '.github/workflows/linux.yml'
      - '.github/workflows/macos.yml'
      - '.github/workflows/cmake.yml'
      - '.github/workflows/windows.yml'
      - 'AGENTS.md'
      - 'CCache/**'
      - 'CHANGES*'
      - 'Examples/**'
      - 'Lib/**'
      - 'Source/**'
      - 'Tools/**'

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-26.04
    name: docs

    steps:
    - name: Machine Info
      run: |
          echo "nproc..."
          nproc --all
          echo "uname..."
          uname --all
          echo "meminfo..."
          cat /proc/meminfo
          echo "lsb-release..."
          cat /etc/lsb-release

    - name: Checkout
      uses: actions/checkout@v6
      with:
        show-progress: false
        persist-credentials: false

    - name: Install
      run: |
          sudo apt-get -qq update
          sudo apt-get -qq install tidy htmldoc weasyprint poppler-utils fonts-liberation

    - name: Docs
      run: |
          make -C Doc/Manual all clean-baks
          # Fail if 'make maketoc' changed a file, such as the numbering or table of contents of a chapter
          if [[ -n "$(git status -s)" ]]; then
            git status -s
            git diff
            exit 1
          fi

    - name: Link Check
      run: make -C Doc/Manual linkchecker3
